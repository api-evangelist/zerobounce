    binding: direct
    confidence: high
    note: MCP startDate/endDate map to REST start_date/end_date (YYYY-MM-DD).

  - tool: bulk_validate_send_file
    category: bulk-validation
    rest:
      - 'POST https://bulkapi.zerobounce.net/v2/sendfile'
    binding: direct
    confidence: high
    note: >-
      MCP passes fileContent as a string and constructs the multipart body; REST takes a
      file part plus email_address_column, return_url and the optional name/gender/IP
      column indexes the MCP tool does not expose.

  - tool: bulk_validate_file_status
    category: bulk-validation
    rest:
