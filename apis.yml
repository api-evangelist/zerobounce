- aid: zerobounce:zerobounce-validation-api
  name: ZeroBounce Validation API
  description: >-
    The ZeroBounce ChatGPT-plugin validation surface — 2 operations for single and batch email
    validation, served from members-api.zerobounce.net. The single-validation operation accepts up to 3
    unauthenticated requests per day without an API key. This is the only ZeroBounce surface with a
    published OpenAPI.
