summary: >-
  ZeroBounce publishes a dated product-updates feed at /updates covering the whole
  platform — integrations, billing, account security and API behaviour mixed together.
  There is no API-only changelog, no per-release version numbering and no
  breaking-vs-additive labelling, so a consumer cannot tell from the feed whether an
  entry changes a response payload. Entries are dated to the month, not the day.
