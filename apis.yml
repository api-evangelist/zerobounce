aid: zerobounce
name: ZeroBounce
description: >-
  ZeroBounce is an email validation and deliverability platform that verifies
  email addresses, detects spam traps and abuse accounts, scores leads, and
  helps senders reduce bounce rates and protect sender reputation. The
  platform provides real-time and batch email validation, credit balance
  checks, file-based validation jobs, email finder, domain search, and AI
  scoring through a versioned REST API. The ZeroBounce v2 API uses a per-
  request api_key parameter and supports both global and EU endpoints.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Email Validation
  - Email Deliverability
  - Email Verification
  - Marketing
  - Lead Scoring
  - Anti-Spam
