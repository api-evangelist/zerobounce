    confidence: high

  - tool: bulk_ai_scoring_send_file
    category: ai-scoring
    rest:
      - 'POST https://bulkapi.zerobounce.net/v2/scoring/sendfile'
    binding: direct
    confidence: high

  - tool: bulk_ai_scoring_file_status
    category: ai-scoring
    rest:
      - 'GET https://bulkapi.zerobounce.net/v2/scoring/filestatus'
    binding: direct
    confidence: high

  - tool: bulk_ai_scoring_get_file
    category: ai-scoring
    rest:
      - 'GET https://bulkapi.zerobounce.net/v2/scoring/getfile'
    binding: direct
    confidence: high

  - tool: bulk_ai_scoring_delete_file
    category: ai-scoring
    rest:
      - 'GET https://bulkapi.zerobounce.net/v2/scoring/deletefile'
    binding: direct
    confidence: high

  - tool: find_email
    category: email-finder
    rest:
      - 'GET /v2/guessformat'
    binding: direct
    confidence: high
    note: >-
      MCP firstName/middleName/lastName/domain map to REST first_name/middle_name/
      last_name/domain. MCP additionally accepts `company`, which the Postman collection
      does not list as a guessformat parameter — the SDK resolves company to a domain
      before calling REST.

  - tool: domain_search
    category: domain-search
    rest:
      - 'GET /v2/guessformat'
    binding: shared-operation
    confidence: medium
    note: >-
      Domain Search and Email Finder are the same REST endpoint (/v2/guessformat) called
      with different parameter sets — domain/company only, versus domain plus a person
      name. Two MCP tools, one REST operation. Confidence is medium because ZeroBounce
      documents them as separate products but publishes no separate endpoint.

  - tool: get_activity_data
    category: activity
    rest:
      - 'GET /v2/activity'
    binding: direct
    confidence: high

