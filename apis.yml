- aid: zerobounce:bulk-api
  name: ZeroBounce Bulk API
  description: >-
    Asynchronous file-job surface for bulk email validation, bulk AI scoring, bulk email finder, bulk
    domain search, List Evaluator and Amazon S3 file operations. Runs on a separate, non-region-split
    host and is the only part of the ZeroBounce API with a durable resource identifier (file_id) and a
    completion callback (return_url).
  humanURL: https://www.zerobounce.net/docs/email-validation-api-quickstart/v2-file-management-api
