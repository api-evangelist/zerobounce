summary: >-
  ZeroBounce's conformance story is entirely compliance-side, not protocol-side. It holds
  and publishes named security and privacy certifications on a real trust center, and it
  meets the residency requirements that matter for email data. On the wire it conforms to
  almost no cross-cutting API standard: no OpenAPI for the production v2 API, no OAuth or
  OIDC, no RFC 9457 problem details, no RFC 8594 sunset headers, no RFC 9116 security.txt,
  no RateLimit header standard, no pagination convention and no idempotency contract.

