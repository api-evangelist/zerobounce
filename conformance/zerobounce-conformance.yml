      note: SOC 2 listed on the ZeroBounce trust center.
  - id: iso27001
    conforms: true
    evidence:
      source: https://trust.zerobounce.net/
      note: ISO/IEC 27001 listed on the ZeroBounce trust center.
  - id: pci-dss
    conforms: true
    evidence:
      source: https://trust.zerobounce.net/
      note: PCI DSS listed on the ZeroBounce trust center (payment handling for credit purchase).
  - id: hipaa
    conforms: true
    evidence:
      source: https://trust.zerobounce.net/
      note: HIPAA listed on the ZeroBounce trust center.
  - id: gdpr
    conforms: true
    evidence:
      source: https://trust.zerobounce.net/
      note: >-
        GDPR listed on the trust center and backed operationally by the EU-only
        api-eu.zerobounce.net residency endpoint.
  - id: data-residency
    conforms: true
    evidence:
      source: https://www.zerobounce.net/docs/api-dashboard/api-endpoints
      note: >-
        Separate US-only and EU-only API hosts where "validations and other interactions
        only occur within" that region.

standards:
  - id: openapi
    conforms: partial
    evidence:
      note: >-
        The only OpenAPI ZeroBounce publishes is the ChatGPT-plugin spec for
        members-api.zerobounce.net (2 operations, captured in openapi/). No OpenAPI,
        Swagger or JSON-schema description of the 32-operation production v2 API exists.
        Probed /openapi.json, /openapi.yaml, /swagger.json, /v2/openapi.json, /api-docs,
        /swagger/v1/swagger.json and /docs on api, api-eu, members-api, bulkapi and www —
        every one 404s or 403s, and www.zerobounce.net/docs/openapi.json returns the
        Next.js HTML shell, not a spec. The nearest first-party machine-readable inventory
        is the official Postman collection at github.com/zerobounce/postman-v2.
  - id: asyncapi
    conforms: false
    evidence:
      note: >-
        No AsyncAPI document. Two per-request completion callbacks exist and are catalogued
        in asyncapi/zerobounce-webhooks.yml.
  - id: graphql
    conforms: false
    evidence:
      note: No GraphQL surface. No /graphql endpoint on any host.
  - id: grpc
    conforms: false
    evidence:
      note: No .proto published in the GitHub org, on buf.build, or in the docs.
  - id: mcp
    conforms: true
    evidence:
      source: https://github.com/zerobounce/zerobounce-mcp
      note: >-
        Official MCP server on @modelcontextprotocol/sdk ^1.29.0, 16 tools, Apache-2.0.
        Local stdio only — no hosted endpoint. See mcp/zerobounce-mcp.yml.
  - id: a2a
    conforms: false
    evidence:
      note: No A2A Agent Card on any host. See well-known/zerobounce-well-known.yml.
  - id: oauth2
    conforms: false
    evidence:
      note: Single account API key. No authorization server, no token endpoint, no scopes.
  - id: oidc
    conforms: false
    evidence:
      note: >-
        No /.well-known/openid-configuration on any host. Okta Passkey is used for the
