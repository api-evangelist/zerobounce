summary: >-
  ZeroBounce sells validation as prepaid credits, available either as a monthly
  ZeroBounce ONE subscription or as pay-as-you-go packs, with a permanent free tier and
  a sales-gated enterprise band above 1M credits/month. Credits are the metering unit for
  every product: 1 credit per email validated or scored, 20 credits per Email Finder
  query. The public pricing page states the entry subscription price and the free-tier
  allowances, but does NOT publish the per-credit pay-as-you-go rate card as machine- or
  page-readable numbers, so per-credit prices are recorded as null rather than guessed.
plan_count: 4
currency: USD

