aid: zerobounce
name: ZeroBounce
description: >-
  ZeroBounce is an email validation and deliverability platform that verifies
  email addresses, detects spam traps and abuse accounts, scores leads, and
  helps senders reduce bounce rates and protect sender reputation. The
  platform provides real-time and batch email validation, credit balance
  checks, file-based validation jobs, email finder, domain search, activity
  data, list evaluation and AI scoring through a versioned REST API. The
  ZeroBounce v2 API uses a per-request api_key parameter with no OAuth or
  scopes, and is served from region-split hosts for US and EU data residency
  plus a separate bulk host for asynchronous file jobs. ZeroBounce also ships
  an official MCP server and first-party SDKs across nine languages.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-service
  trial: true
  try_now: true
  public: true
  label: Freemium self-service
  confidence: high
  source:
    - https://www.zerobounce.net/pricing
    - https://www.zerobounce.net/members/createaccount
    - https://www.zerobounce.net/free-email-verifier
  generated: '2026-08-13'
  method: searched
  note: >-
    Upgraded from unknown/derived. ZeroBounce publishes a permanent Freemium tier
    (100 validation credits per month, refilling), self-service account creation, a
    published price for the entry ZeroBounce ONE subscription ($99/month), and a
    keyless browser verifier plus 3 free unauthenticated plugin validations per day.
