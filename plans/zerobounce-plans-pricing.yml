credit_model:
  unit: credit
  consumption:
    - action: validate one email
      credits: 1
    - action: AI-score one email
      credits: 1
    - action: Email Finder query
      credits: 20
    - action: validate a sandbox test address
      credits: 0
      note: >-
        The documented @example.com sandbox addresses consume no credits. See
        sandbox/zerobounce-sandbox.yml.
  expiry: >-
    Credits never expire on ZeroBounce ONE and on pay-as-you-go packs; Freemium credits
