source: >-
  mcp/zerobounce-mcp.yml (tool definitions read from github.com/zerobounce/zerobounce-mcp
  src/tools/*.ts) bound against the REST v2 surface in
  collections/zerobounce-api-v2-official.postman_collection.json
  (github.com/zerobounce/postman-v2, first-party) and
  openapi/zerobounce-validation-api-openapi.yml.
description: >-
  Binds every ZeroBounce MCP tool to the REST operation that backs it, and records the
  operations that have no tool. ZeroBounce publishes no OpenAPI for the v2 REST API, so
  the REST side of this crosswalk is keyed on the METHOD + PATH of the provider's own
  Postman collection rather than on OpenAPI operationIds — the only first-party
  machine-readable inventory of v2 that exists. Where an operationId does exist (the
  ChatGPT-plugin OpenAPI in openapi/) it is named explicitly.

surfaces:
  openapi:
    path: openapi/zerobounce-validation-api-openapi.yml
    host: https://members-api.zerobounce.net
    operations: 2
    note: >-
      This is the ZeroBounce ChatGPT-plugin OpenAPI, not the v2 API. It covers only
      single and batch validation and is served from a different host. No OpenAPI for
      api-us/api-eu/bulkapi v2 is published anywhere — see conformance/ for the probe log.
  rest_v2:
    source: collections/zerobounce-api-v2-official.postman_collection.json
    hosts:
      - https://api-us.zerobounce.net/v2
      - https://api-eu.zerobounce.net/v2
      - https://api.zerobounce.net/v2
      - https://bulkapi.zerobounce.net
    operations: 32
    gated: false
    note: Every REST operation requires an account api_key; the collection itself is public.
  mcp:
    package: '@zerobounce/mcp'
    transport: local-stdio
    url: null
    tools: 16
    gated: true
    note: >-
      No hosted MCP endpoint exists, so tools/list cannot be called remotely. Tool schemas
      here come from the provider's published source, not a live introspection.
  graphql:
    present: false

crosswalk:
  - tool: validate_email
    category: validation
    rest:
      - 'GET /v2/validate'
    openapi_operation_ids:
      - validate
    binding: direct
    confidence: high
    note: >-
      MCP `email`/`ipAddress` map to REST `email`/`ip_address`. The plugin OpenAPI
      operationId `validate` is the same capability on members-api.zerobounce.net.

  - tool: validate_batch
    category: validation
    rest:
      - 'POST /v2/validatebatch'
    openapi_operation_ids:
      - validateBatch
    binding: direct
    confidence: high
    note: >-
      REST accepts up to 100 email_batch entries per call at 30 req/min (40 on
      ZeroBounce ONE). The MCP tool does not surface that ceiling.

  - tool: get_credits
    category: account
    rest:
