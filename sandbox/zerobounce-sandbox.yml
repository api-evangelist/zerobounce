generated: '2026-08-13'
method: searched
source: https://www.zerobounce.net/docs/email-validation-api-quickstart/v2-sandbox-mode
docs: https://www.zerobounce.net/docs/email-validation-api-quickstart/v2-sandbox-mode
summary: >-
  ZeroBounce has no separate test-mode key and no separate sandbox host. Instead it
  reserves a fixed set of magic @example.com addresses that the LIVE endpoint recognises
  and answers with a deterministic status/sub_status, consuming ZERO credits. You still
  send your real production API key. This is the identifier-based sandbox pattern (the
  same shape as Twilio's +1500555xxxx magic numbers) rather than the key-prefix pattern
  (Stripe sk_test_).
model: magic-identifiers
separate_test_key: false
separate_test_host: false
credits_consumed: 0
requires_live_api_key: true
note_verbatim: >-
  "You will still need to use your API KEY with these test email addresses." Test
  addresses "will not use any of your credits."

test_addresses:
  - value: valid@example.com
    expects: status valid
  - value: invalid@example.com
    expects: status invalid
  - value: catch_all@example.com
    expects: status catch-all
  - value: spamtrap@example.com
    expects: status spamtrap
  - value: abuse@example.com
    expects: status abuse
  - value: unknown@example.com
    expects: status unknown
  - value: donotmail@example.com
    expects: status do_not_mail
  - value: toxic@example.com
    expects: sub_status toxic
  - value: disposable@example.com
    expects: sub_status disposable
  - value: role_based@example.com
    expects: sub_status role_based
  - value: role_based_catch_all@example.com
    expects: sub_status role_based_catch_all
  - value: role_based_accept_all@example.com
