test_ip:
  value: 99.110.204.1
  purpose: >-
    Passed as the ip_address parameter to exercise GEO-location fields in the validation
    response.

time_simulation:
  supported: false
  note: No test clocks or time-travel fixtures are published.

fixtures:
  supported: false
  note: >-
    No fixture/trigger tooling and no sandbox for the bulk file, AI scoring, Email Finder
    or List Evaluator surfaces — the magic addresses exercise real-time validation only.
    Bulk file jobs and their return_url callbacks must be tested against live credits.

free_tools:
  - name: Free Email Verifier
    url: https://www.zerobounce.net/free-email-verifier
    note: Browser-based single-address check, no key required. Not an API sandbox.
  - name: ChatGPT plugin endpoint
    url: https://members-api.zerobounce.net/api/validation/chatgpt-single-email-validation/
    note: >-
      Accepts up to 3 unauthenticated single validations per day with no API key — the
      closest thing ZeroBounce has to a keyless trial call. See
      openapi/zerobounce-validation-api-openapi.yml.
