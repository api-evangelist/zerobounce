note: >-
  ZeroBounce serves NO /.well-known/ documents. Every path on every host either 404s
  (www, bulkapi, members-api — all returning the marketing/API SPA HTML shell, not a
  document) or is refused with a Cloudflare 403 (api, api-us, api-eu, which block
  non-browser traffic on any path outside /v2/*). docs.zerobounce.net answers 200 for
  every /.well-known/* path but the body is a Cloudflare "301 Moved Permanently" HTML
  page, i.e. an SPA/redirect catch-all, NOT a document — recorded as a miss, not a hit.
  Because no path returned a real document, NO WellKnown and NO SecurityTxt pointer is
  emitted in apis.yml. This is a recorded absence, not a presence.
  ZeroBounce does publish a vulnerability-disclosure page at
  https://www.zerobounce.net/security (see security/zerobounce-vulnerability-disclosure.yml)
  — they simply do not mirror it at /.well-known/security.txt (RFC 9116).
